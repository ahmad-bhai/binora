
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binora | Reset Password</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        :root {
            --maroon-dark: #4a0e0e;
            --maroon-base: #800000;
            --maroon-light: #a52a2a;
            --bg-dark: #0f0000;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #2a0505 0%, #000000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }
        .header { text-align: center; margin-bottom: 40px; }
        .logo-icon { width: 55px; height: 55px; stroke: var(--maroon-light); margin-bottom: 15px; }
        .header h1 { font-size: 30px; font-weight: 800; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; color: var(--maroon-light); margin-bottom: 10px; font-weight: 700; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper svg { position: absolute; left: 16px; width: 18px; stroke: var(--text-dim); }
        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 15px 15px 15px 48px;
            border-radius: 14px;
            color: white;
            outline: none;
        }
        .btn-reset {
            width: 100%;
            background: var(--maroon-base);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .footer-text { text-align: center; margin-top: 30px; font-size: 14px; color: var(--text-dim); }
        .footer-text a { color: var(--maroon-light); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="header">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            <h1>Reset Password</h1>
            <p>Update your Binora account security</p>
        </div>
        <form>
            <div class="form-group">
                <label>Registered Email</label>
                <div class="input-wrapper">
                    <input type="email" placeholder="Enter your email" required>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <input type="password" placeholder="New password" required>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" placeholder="Confirm password" required>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
            </div>
            <button type="submit" class="btn-reset">Reset Password</button>
        </form>
        <div class="footer-text">
            Back to <a href="login.html">Login</a>
        </div>
    </div>
</body>
</html>
