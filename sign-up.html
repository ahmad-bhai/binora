
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binora | Register Account</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --maroon-dark: #4a0e0e;
            --maroon-base: #800000;
            --maroon-light: #a52a2a;
            --bg-dark: #0f0000;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #2a0505 0%, #000000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            stroke: var(--maroon-light);
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--maroon-light);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 15px;
            width: 18px;
            height: 18px;
            stroke: var(--text-dim);
            transition: 0.3s;
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 14px 15px 14px 45px;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--maroon-base);
            background: rgba(128, 0, 0, 0.05);
            box-shadow: 0 0 15px rgba(128, 0, 0, 0.2);
        }

        .form-group input:focus + svg {
            stroke: var(--maroon-light);
        }

        .referral-info {
            background: rgba(128, 0, 0, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .btn-signup {
            width: 100%;
            background: var(--maroon-base);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-signup:hover {
            background: var(--maroon-light);
            box-shadow: 0 10px 20px rgba(128, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .footer-text a {
            color: var(--maroon-light);
            text-decoration: none;
            font-weight: 600;
        }

        /* Admin Hook Classes (For Firebase/Backend) */
        .admin-data { display: none; }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="header">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            <h1>Join Binora</h1>
            <p>Start your professional trading journey with scripts</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="userName" placeholder="e.g. Ahmad Bhai" required>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="userEmail" placeholder="name@example.com" required>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="userPassword" placeholder="••••••••" required>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
            </div>

            <div class="form-group">
                <label>Referral Code (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="referralCode" placeholder="Enter code to get bonus">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </div>
                <div class="referral-info">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span>Earn 0.5 points per invite. (1000 Pts = $1)</span>
                </div>
            </div>

            <button type="submit" class="btn-signup">
                Create Account
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="#">Login here</a>
        </div>
    </div>

    <!-- Hidden Config for Admin Panel Connection -->
    <div class="admin-data" id="referralConfig" 
         data-points-per-referral="0.5" 
         data-conversion-rate="1000:1" 
         data-default-currency="USD">
    </div>

    <script>
        // Frontend logic for referral point calculation display or basic validation
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Data collection for Firebase/Admin Panel
            const userData = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                ref: document.getElementById('referralCode').value,
                points: 0,
                balance: 0.00
            };
            console.log("Ready to send to Admin Panel:", userData);
            alert("Account data ready for Admin Processing!");
        });
    </script>

</body>
                      </html>
